<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' 'unsafe-inline' app:; img-src 'self' app: data: blob:; connect-src ws: wss:" />
  <title>Kritzel &amp; Raten</title>
  <link rel="stylesheet" href="app://sdk/ui.css" />
  <style>
    canvas#game { display: none; }
    #sdk-chat { display: none !important; }
    body { background: #1b222c; }
    #kr { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 70px 1fr; gap: 14px; padding: 14px; }
    #kr-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; background: #232c38; border-radius: 4px; padding: 0 18px; border-bottom: 3px solid #151b22; }
    #kr-word { flex: 1; text-align: center; font: 800 30px Consolas, monospace; letter-spacing: .3em; color: #ffd25a; }
    #kr-info { color: #9aa7b8; font-weight: 700; min-width: 220px; }
    #kr-time { font: 800 26px 'Segoe UI'; width: 70px; text-align: right; }
    #kr-stage { position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    #kr-paperwrap { flex: 1; position: relative; display: grid; place-items: center; min-height: 0; }
    #kr-paper { background: #fffdf6; border-radius: 4px; box-shadow: 0 6px 0 #0f141a; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; cursor: crosshair; touch-action: none; }
    #kr-tools { display: flex; gap: 8px; align-items: center; justify-content: center; background: #232c38; border-radius: 4px; padding: 8px; }
    #kr-tools.off { visibility: hidden; }
    .sw { width: 30px; height: 30px; border-radius: 4px; border: 3px solid transparent; cursor: pointer; }
    .sw.on { border-color: #fff; }
    .sz { width: 34px; height: 34px; border-radius: 4px; background: #2b3644; display: grid; place-items: center; cursor: pointer; border: 3px solid transparent; }
    .sz.on { border-color: #f08c32; }
    .sz i { background: #fff; border-radius: 50%; display: block; }
    #kr-side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    #kr-players { background: #232c38; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .pl { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 3px; background: #2b3644; font-weight: 700; }
    .pl .s { margin-left: auto; color: #ffd25a; }
    .pl.ok { background: #2f5a28; }
    .pl .pen { color: #f08c32; }
    #kr-chat { flex: 1; background: #232c38; border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
    #kr-log { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; user-select: text; }
    #kr-log .sys { color: #9aa7b8; font-style: italic; }
    #kr-log .good { color: #6abf4b; font-weight: 800; }
    #kr-input { margin: 8px; padding: 10px; border-radius: 3px; border: 2px solid #354253; background: #1a212a; color: #fff; font: 14px 'Segoe UI'; outline: none; user-select: text; }
    #kr-input:focus { border-color: #f08c32; }
    #kr-choose { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,26,34,.75); }
    #kr-choose .box { background: #232c38; padding: 22px; border-radius: 4px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    #kr-choose .opts { display: flex; gap: 10px; }
    #kr-choose button { padding: 12px 18px; border: 0; border-radius: 4px; background: #f08c32; color: #2a1404; font: 800 16px 'Segoe UI'; cursor: pointer; border-bottom: 3px solid #b45f1c; }
    #kr-banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(27,34,44,.92); padding: 16px 26px; border-radius: 4px; font-size: 22px; font-weight: 800; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="kr">
    <div id="kr-top"><div id="kr-info">Warte auf Spieler …</div><div id="kr-word"></div><div id="kr-time"></div></div>
    <div id="kr-stage">
      <div id="kr-paperwrap"><canvas id="kr-paper" width="1000" height="750"></canvas>
        <div id="kr-choose" class="hidden"><div class="box"><b>Wähle einen Begriff zum Malen:</b><div class="opts" id="kr-opts"></div></div></div>
        <div id="kr-banner" class="hidden"></div>
      </div>
      <div id="kr-tools" class="off"></div>
    </div>
    <div id="kr-side">
      <div id="kr-players"></div>
      <div id="kr-chat"><div id="kr-log"></div><input id="kr-input" maxlength="80" placeholder="Hier raten … (Enter)" autocomplete="off" /></div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
