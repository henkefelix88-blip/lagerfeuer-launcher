<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' app:; script-src 'self' app: blob:; worker-src blob:; style-src 'self' 'unsafe-inline' app:; img-src 'self' app: data:; connect-src ws: wss:; media-src 'self' app:" />
  <title>Lagerfeuer Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Low-Poly-Hintergrund (rein dekorativ) -->
  <svg class="bg-poly" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <polygon points="0,900 0,620 260,700 520,610 800,720 1100,600 1380,690 1600,640 1600,900" fill="#202a35"/>
    <polygon points="0,900 0,740 300,800 650,720 900,820 1250,740 1600,800 1600,900" fill="#1d2630"/>
    <polygon points="0,620 260,700 140,760" fill="#24303c"/>
    <polygon points="800,720 1100,600 980,770" fill="#24303c"/>
    <polygon points="1380,690 1600,640 1600,760" fill="#24303c"/>
  </svg>

  <header class="topbar">
    <div class="brand" id="brand"></div>
    <nav class="tabs">
      <button class="tab active" data-view="library"><span data-icon="library"></span>Bibliothek</button>
      <button class="tab" data-view="party"><span data-icon="party"></span>Party <span class="badge hidden" id="party-badge">0</span></button>
      <button class="tab" data-view="settings"><span data-icon="settings"></span>Einstellungen</button>
    </nav>
    <button class="update-chip hidden" id="update-chip"></button>
    <div class="player-chip" id="player-chip" title="Spielername (in den Einstellungen änderbar)"><span data-icon="user"></span><span id="player-name">Spieler</span></div>
  </header>

  <main>
    <section class="view active" id="view-library"></section>
    <section class="view" id="view-party"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
